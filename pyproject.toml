[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevbatch"
version = "0.1.0"
description = "Score CSV/JSONL rows with TypeSafe Jev — YAML policies, calibrated confidence, auto/review/escalate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noorullah Jamakzai" }]
keywords = ["typesafe", "jev", "system-one", "batch", "cli", "gtm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typesafe-sdk>=0.7.0",
  "polars>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jevbatch = "jevbatch.cli:app"

[project.urls]
Homepage = "https://github.com/jamakzai12/jevbatch"
Repository = "https://github.com/jamakzai12/jevbatch"
Issues = "https://github.com/jamakzai12/jevbatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbatch"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/LICENSE",
  "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
